openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Canon local API
  version: 1.3.0
  description: |
    The API behind `canon serve`, on 127.0.0.1 only. Every request needs
    `Authorization: Bearer <token>`, where the token is the one `canon serve`
    printed in the URL fragment. Requests whose Host isn't 127.0.0.1:<port> or
    localhost:<port> get 421, and no response ever carries CORS headers.

    Errors are `application/problem+json` (RFC 9457). Item writes take
    `If-Match` with the working manifest revision and fail with 412 when it
    moved.

    Frozen at the end of M1; changes since are additive only (1.1.0: D33,
    1.2.0: D39, 1.3.0: D50). Handlers land in M3 to M6; `GET /api/health` exists from M0.

    Every operation has a CLI twin (`x-cli`), so nothing is UI-only:

    | Operation | CLI |
    |---|---|
    | getHealth, getDoctor | `canon doctor` |
    | getSyncStatus | `canon status` |
    | pullRemote | `canon pull [--discard-local]` |
    | listItems | `canon ls` |
    | getItem | `canon show` |
    | createItem, updateItem, deleteItem | `canon item new`, `canon item set`, `canon item rm` |
    | getTaxonomy, putTaxonomyTerm | `canon taxonomy ls`, `canon taxonomy set` |
    | listSurfaces, previewSurface | `canon view`, `canon view <surface>` |
    | startIngest, getIngest | `canon ingest <paths>` |
    | createPlan, getPlan, applyPlan, getApplyStatus | `canon plan -o`, `canon plan show`, `canon apply` |
    | listJobs, retryJob | `canon jobs`, `canon jobs retry` |
    | runJobs, getJobRun | `canon jobs run` |
    | getEvents | `--watch` flags (`canon jobs --watch`) |
    | getLocalBlob, getLocalDerived | none: read-only view of the local cache for offline thumbnails |
servers:
  - url: http://127.0.0.1:4747
security:
  - bearer: []

paths:
  /api/health:
    get:
      operationId: getHealth
      x-cli: canon doctor
      summary: Liveness check
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                required: [status]
                additionalProperties: false
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/doctor:
    get:
      operationId: getDoctor
      x-cli: canon doctor
      summary: Run the doctor checks
      responses:
        "200":
          description: The report. A failed check is still a 200.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/sync/status:
    get:
      operationId: getSyncStatus
      x-cli: canon status
      summary: Compare the working manifest with the remote generation (one metadata request)
      responses:
        "200":
          description: Sync state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/sync/pull:
    post:
      operationId: pullRemote
      x-cli: canon pull
      summary: Fetch the remote manifest
      description: Fast-forwards when there are no local edits. With local edits it refuses unless discardLocal is set; v1 never merges.
      parameters:
        - name: discardLocal
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Pulled; the new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Offline" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/items:
    get:
      operationId: listItems
      x-cli: canon ls
      summary: List items in the working manifest
      parameters:
        - { name: kind, in: query, schema: { $ref: "../schema/common.schema.json#/$defs/kind" } }
        - { name: surface, in: query, schema: { $ref: "../schema/common.schema.json#/$defs/slug" } }
        - { name: visibility, in: query, schema: { type: string, enum: [draft, public] } }
        - { name: tag, in: query, schema: { $ref: "../schema/common.schema.json#/$defs/slug" } }
        - { name: q, in: query, description: "Case-insensitive match on title, slug and aliases.", schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Matching items, sorted by id.
          headers:
            ETag: { $ref: "#/components/headers/Revision" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision: { $ref: "#/components/schemas/Revision" }
                  items:
                    type: array
                    items: { $ref: "../schema/manifest.schema.json#/$defs/item" }
                required: [revision, items]
                additionalProperties: false
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createItem
      x-cli: canon item new
      summary: Add a draft item
      description: The server assigns the id (a ULID) and forces visibility to draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewItem" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/Revision" }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "../schema/manifest.schema.json#/$defs/item" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/items/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      operationId: getItem
      x-cli: canon show
      summary: One item, by id, slug or alias
      responses:
        "200":
          description: The item.
          headers:
            ETag: { $ref: "#/components/headers/Revision" }
          content:
            application/json:
              schema: { $ref: "../schema/manifest.schema.json#/$defs/item" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateItem
      x-cli: canon item set
      summary: Edit an item (JSON Merge Patch, RFC 7396)
      description: id cannot change. The patched item must still validate; semantic problems come back in the 422 body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              not: { required: [id] }
      responses:
        "200":
          description: The updated item.
          headers:
            ETag: { $ref: "#/components/headers/Revision" }
          content:
            application/json:
              schema: { $ref: "../schema/manifest.schema.json#/$defs/item" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteItem
      x-cli: canon item rm
      summary: Remove a draft that was never published
      description: Anything ever published is unpublished (visibility draft) instead, so its history and aliases stay.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Removed.
          headers:
            ETag: { $ref: "#/components/headers/Revision" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/taxonomy:
    get:
      operationId: getTaxonomy
      x-cli: canon taxonomy ls
      summary: Every vocabulary
      responses:
        "200":
          description: Taxonomy.
          headers:
            ETag: { $ref: "#/components/headers/Revision" }
          content:
            application/json:
              schema: { $ref: "../schema/manifest.schema.json#/$defs/taxonomy" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/taxonomy/{vocab}/{slug}:
    put:
      operationId: putTaxonomyTerm
      x-cli: canon taxonomy set
      summary: Create or update one term
      parameters:
        - { name: vocab, in: path, required: true, schema: { type: string, enum: [categories, tech, mediums, tags, viewports] } }
        - { name: slug, in: path, required: true, schema: { $ref: "../schema/common.schema.json#/$defs/slug" } }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A viewport for vocab viewports, otherwise a term. The slug must match the path.
              anyOf:
                - $ref: "../schema/common.schema.json#/$defs/taxonomyTerm"
                - $ref: "../schema/common.schema.json#/$defs/viewport"
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/Revision" }
          content:
            application/json:
              schema: { $ref: "../schema/manifest.schema.json#/$defs/taxonomy" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/surfaces:
    get:
      operationId: listSurfaces
      x-cli: canon view
      summary: Surfaces declared in the manifest, with their registration state
      responses:
        "200":
          description: Surfaces.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SurfaceInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/surfaces/{id}/preview:
    get:
      operationId: previewSurface
      x-cli: canon view
      summary: The view this surface would get from the working manifest
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "../schema/common.schema.json#/$defs/slug" } }
      responses:
        "200":
          description: The resolved view. Its `view` field says which schema applies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnyView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ingest:
    post:
      operationId: startIngest
      x-cli: canon ingest
      summary: Sanitize and hash dropped files, then draft items
      description: Drag and drop gives file contents, not paths, so files arrive as multipart parts. Originals on disk are never touched.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, contentMediaType: application/octet-stream }
                  minItems: 1
              required: [files]
      responses:
        "202":
          description: Accepted; poll getIngest or watch getEvents.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestBatch" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ingest/{id}:
    get:
      operationId: getIngest
      x-cli: canon ingest
      summary: Progress of an ingest batch
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "../schema/common.schema.json#/$defs/ulid" } }
      responses:
        "200":
          description: The batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestBatch" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/plans:
    post:
      operationId: createPlan
      x-cli: canon plan
      summary: Compute a plan from the working manifest and the remote listing
      description: Pulls first when the remote moved and there are no local edits. Refuses with 409 when both moved (added in 1.2.0).
      responses:
        "201":
          description: The saved plan. An empty ops list means nothing to do.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Offline" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/plans/{id}:
    get:
      operationId: getPlan
      x-cli: canon plan
      summary: A saved plan
      parameters:
        - $ref: "#/components/parameters/PlanID"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/plans/{id}/apply:
    post:
      operationId: applyPlan
      x-cli: canon apply
      summary: Execute a saved plan, and nothing else
      description: The only call that changes the cloud. Refuses with 409 if the remote manifest generation moved since the plan was made.
      parameters:
        - $ref: "#/components/parameters/PlanID"
      responses:
        "202":
          description: Applying; progress arrives on getEvents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Offline" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      operationId: getApplyStatus
      x-cli: canon apply
      summary: Progress of the plan's apply (added in 1.2.0; poll it like getIngest)
      parameters:
        - $ref: "#/components/parameters/PlanID"
      responses:
        "200":
          description: The latest status. Kept until canon serve restarts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/jobs:
    get:
      operationId: listJobs
      x-cli: canon jobs
      summary: Derived-asset jobs
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/JobState" } }
      responses:
        "200":
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/jobs/{id}/retry:
    post:
      operationId: retryJob
      x-cli: canon jobs retry
      summary: Queue a failed job again
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: The job, now pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/jobs/run:
    post:
      operationId: runJobs
      x-cli: canon jobs run
      summary: Run every job the manifest needs, in the background
      description: |
        Failed jobs are retried too. Jobs whose outputs are in the local
        cache, or whose receipt is in the private bucket, don't run again.
        Facts recipes fill only empty facts unless refreshFacts is set (D48).
      parameters:
        - { name: item, in: query, description: "Only this item (id or slug).", schema: { type: string } }
        - { name: recipe, in: query, description: "Only this recipe (name).", schema: { type: string, pattern: "^[a-z0-9-]+$" } }
        - { name: refreshFacts, in: query, schema: { type: boolean } }
      responses:
        "202":
          description: Started. Poll getJobRun.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRun" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      operationId: getJobRun
      x-cli: canon jobs run
      summary: The latest background run's status
      responses:
        "200":
          description: Its state, and the report once it's done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/local/blobs/{sha256}:
    get:
      operationId: getLocalBlob
      x-cli: none
      summary: A sanitized blob from the local cache
      parameters:
        - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: The bytes, with the type detected at ingest.
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/local/derived/{jobkey}/{file}:
    get:
      operationId: getLocalDerived
      x-cli: none
      summary: A derived output from the local cache
      parameters:
        - { name: jobkey, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" } }
      responses:
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/events:
    get:
      operationId: getEvents
      x-cli: canon jobs --watch
      summary: Server-sent events for ingest, jobs, apply and sync
      description: Read with fetch, not EventSource, so the bearer header still applies. Each `data:` line is one Event as JSON.
      responses:
        "200":
          description: An open event stream.
          content:
            text/event-stream:
              schema: { type: string }
              x-event: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Per-launch random token from `canon serve`.

  headers:
    Revision:
      description: Working manifest revision; send it back as If-Match.
      schema: { $ref: "#/components/schemas/Revision" }

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The revision the edit was based on.
      schema: { $ref: "#/components/schemas/Revision" }
    ItemID:
      name: id
      in: path
      required: true
      description: Item id, slug or alias.
      schema:
        anyOf:
          - $ref: "../schema/common.schema.json#/$defs/ulid"
          - $ref: "../schema/common.schema.json#/$defs/slug"
    PlanID:
      name: id
      in: path
      required: true
      schema: { $ref: "../schema/common.schema.json#/$defs/ulid" }

  responses:
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with current state (local edits, a moved remote, a published item).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: If-Match doesn't match the working revision.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Invalid:
      description: The result would not validate. `problems` lists why.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Offline:
      description: GCS is unreachable. Editing still works; plan, apply and pull need the network.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: Upload too large.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Revision:
      type: string
      pattern: '^"[0-9a-f]{16,64}"$'
      description: A quoted ETag.

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        problems:
          type: array
          items: { $ref: "#/components/schemas/ValidationProblem" }
      required: [type, title, status]

    ValidationProblem:
      type: object
      properties:
        code: { type: string }
        severity: { type: string, enum: [error, warning] }
        path: { type: string, description: JSON Pointer into the manifest. }
        message: { type: string }
      required: [code, severity, path, message]
      additionalProperties: false

    NewItem:
      description: An item without id and visibility; both are set by the server.
      type: object
      properties:
        slug: { $ref: "../schema/common.schema.json#/$defs/slug" }
        kind: { $ref: "../schema/common.schema.json#/$defs/kind" }
        title: { type: string, minLength: 1, maxLength: 200 }
      required: [slug, kind, title]
      not:
        anyOf:
          - required: [id]
          - required: [visibility]

    DoctorReport:
      type: object
      properties:
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, warn, fail, skipped] }
              detail: { type: string }
            required: [name, status]
            additionalProperties: false
        tools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              path: { type: string }
              version: { type: string }
            required: [name, path, version]
            additionalProperties: false
      required: [checks, tools]
      additionalProperties: false

    SyncStatus:
      type: object
      properties:
        state:
          type: string
          description: in-sync; behind (remote moved, no local edits; pulled silently); edited (local edits on top of base); diverged (both); offline.
          enum: [in-sync, behind, edited, diverged, offline]
        baseGeneration: { type: integer, minimum: 0 }
        remoteGeneration: { type: [integer, "null"], minimum: 0 }
        localEdits: { type: boolean }
        revision: { $ref: "#/components/schemas/Revision" }
      required: [state, baseGeneration, remoteGeneration, localEdits, revision]
      additionalProperties: false

    SurfaceInfo:
      type: object
      properties:
        id: { $ref: "../schema/common.schema.json#/$defs/slug" }
        label: { type: string }
        baseUrl: { type: [string, "null"] }
        registered: { type: boolean, description: Whether Canon has schemas for this surface. }
        viewVersion: { type: [integer, "null"] }
        placements: { type: integer, minimum: 0, description: Visible placements on this surface. }
      required: [id, label, baseUrl, registered, viewVersion, placements]
      additionalProperties: false

    AnyView:
      anyOf:
        - $ref: "../schema/surfaces/nickel-desktop/view.schema.json"
        - $ref: "../schema/surfaces/software-portfolio/view.schema.json"
        - $ref: "../schema/surfaces/design-portfolio/view.schema.json"
        - $ref: "../schema/surfaces/art-portfolio/view.schema.json"
        - $ref: "../schema/surfaces/holodeck-showroom/view.schema.json"
        - $ref: "../schema/surfaces/holodeck-art-room/view.schema.json"
        - $ref: "../schema/surfaces/holodeck-dj-room/view.schema.json"

    IngestBatch:
      type: object
      properties:
        id: { $ref: "../schema/common.schema.json#/$defs/ulid" }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              size: { type: integer, minimum: 0 }
              detectedType: { type: [string, "null"], description: MIME type from magic bytes. }
              stage: { type: string, enum: [queued, detect, sanitize, verify, hash, draft, done, failed] }
              blob:
                anyOf:
                  - $ref: "../schema/common.schema.json#/$defs/blobRef"
                  - type: "null"
              item:
                anyOf:
                  - $ref: "../schema/common.schema.json#/$defs/ulid"
                  - type: "null"
              error: { type: [string, "null"], description: Set when stage is failed; verify failures name the surviving tags. }
              note: { type: [string, "null"], description: "Why nothing changed, e.g. \"already ingested as rpg-quests\"." }
            required: [name, size, detectedType, stage, blob, item, error, note]
            additionalProperties: false
      required: [id, files]
      additionalProperties: false

    OpType:
      type: string
      enum: [archive-original, upload-blob, run-job, publish-copy, unpublish, write-manifest, write-history, write-public-manifest, write-view, orphan]

    Plan:
      type: object
      properties:
        id: { $ref: "../schema/common.schema.json#/$defs/ulid" }
        generation: { type: integer, minimum: 0, description: Remote manifest generation the plan was computed against. }
        revision:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Working manifest revision the plan was computed from (added in 1.2.0). Apply refuses if it changed.
        summary:
          type: object
          properties:
            archive: { type: integer, minimum: 0, description: Originals to archive (added in 1.2.0). }
            upload: { type: integer, minimum: 0 }
            jobs: { type: integer, minimum: 0 }
            publish: { type: integer, minimum: 0 }
            unpublish: { type: integer, minimum: 0 }
            orphaned: { type: integer, minimum: 0 }
          required: [archive, upload, jobs, publish, unpublish, orphaned]
          additionalProperties: false
        ops:
          type: array
          description: In execution order. Empty means nothing to do.
          items:
            type: object
            properties:
              type: { $ref: "#/components/schemas/OpType" }
              path: { type: string, description: Object path the op writes or reports. }
              bucket: { type: string, enum: [private, public, archive] }
              item: { anyOf: [{ $ref: "../schema/common.schema.json#/$defs/ulid" }, { type: "null" }] }
              detail: { type: string }
              bytes: { type: [integer, "null"], minimum: 0 }
            required: [type, path, bucket, item, detail, bytes]
            additionalProperties: false
        problems:
          type: array
          description: Warnings to review (e.g. links off owned domains). A plan with errors is never created.
          items: { $ref: "#/components/schemas/ValidationProblem" }
      required: [id, generation, revision, summary, ops, problems]
      additionalProperties: false

    ApplyStatus:
      type: object
      properties:
        plan: { $ref: "../schema/common.schema.json#/$defs/ulid" }
        state: { type: string, enum: [running, done, failed] }
        done: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        newGeneration: { type: [integer, "null"] }
        error: { type: [string, "null"] }
      required: [plan, state, done, total, newGeneration, error]
      additionalProperties: false

    JobState:
      type: string
      enum: [pending, running, done, failed]

    Job:
      type: object
      properties:
        jobkey: { type: string, pattern: "^[0-9a-f]{64}$" }
        recipe: { type: string, pattern: "^[a-z0-9-]+@v[0-9]+$" }
        source: { $ref: "../schema/common.schema.json#/$defs/blobRef" }
        item: { anyOf: [{ $ref: "../schema/common.schema.json#/$defs/ulid" }, { type: "null" }] }
        state: { $ref: "#/components/schemas/JobState" }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, "null"] }
      required: [jobkey, recipe, source, item, state, attempts, lastError]
      additionalProperties: false

    JobRun:
      type: object
      properties:
        state: { type: string, enum: [running, done, failed] }
        report: { anyOf: [{ $ref: "#/components/schemas/JobReport" }, { type: "null" }] }
        error: { type: [string, "null"] }
      required: [state, report, error]
      additionalProperties: false

    JobReport:
      type: object
      properties:
        ran: { type: integer, minimum: 0 }
        cached: { type: integer, minimum: 0, description: "Already in the local cache." }
        remote: { type: integer, minimum: 0, description: "Receipt already in the private bucket." }
        failed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0, description: "Failed before and not retried." }
        facts: { type: integer, minimum: 0, description: "Items whose facts were filled." }
        errors: { type: array, items: { type: string } }
      required: [ran, cached, remote, failed, skipped, facts]
      additionalProperties: false

    Event:
      type: object
      properties:
        type: { type: string, enum: [ingest, job, apply, sync] }
        id: { type: string, description: "The ingest batch, job or plan id, or \"sync\"." }
        data: { description: "The resource's current state: IngestBatch, Job, ApplyStatus or SyncStatus." }
      required: [type, id, data]
      additionalProperties: false
